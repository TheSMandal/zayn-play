org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official

# (v1.0.10) AGP 8.5.2 was tested up to compileSdk 34; the libmpv AAR
# forces compileSdk 37 (see app/build.gradle.kts). This only silences
# AGP's "recommend a newer plugin" warning — the build itself is unaffected.
android.suppressUnsupportedCompileSdk=37

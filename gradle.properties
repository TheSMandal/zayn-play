org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official

# (v1.0.10) AGP 8.5.2 was tested up to compileSdk 34; this build uses
# compileSdk 36 for libmpv (see app/build.gradle.kts). This only silences
# AGP's "recommend a newer plugin" warning — the build itself is unaffected.
android.suppressUnsupportedCompileSdk=36
# (v1.0.10) The libmpv 1.4.0 AAR declares minCompileSdk=37, but SDK
# Platform 37 is preview-channel only and cannot be installed on the CI
# runner (CI 46044264493). Skip the AAR metadata compileSdk check and
# build against stable compileSdk 36 instead.
android.experimental.disableCompileSdkChecks=true

name: Build UI-only APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-only
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - name: APK size and contents
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          ls -l "$APK"
          unzip -l "$APK"
          AAPT2=$(find "${ANDROID_HOME:-$HOME/Android}" -name aapt2 -type f 2>/dev/null | head -1)
          if [ -n "$AAPT2" ]; then "$AAPT2" dump badging "$APK" | grep -E "package:|launchable-activity" || true; else echo "aapt2 not found under ANDROID_HOME"; fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zayn-play-ui-0.2.1
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

name: Build Zayn Play APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Decode fixed signing keystore
        # (v0.2.10) Every build signs with ONE fixed keystore (the
        # release keystore) so APKs update-install over each other.
        # The build FAILS (requireFixedSigning) if this is missing
        # rather than falling back to a fresh debug keystore.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          ls -l keystore.jks
      - name: Install Android API 36 platform
        # (v1.0.10) The build targets compileSdk 36 (stable; Platform 37
        # is preview-only and uninstallable on the runner — CI
        # 46044264493). Install the platform in case the runner image
        # does not ship it.
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace \
            -PfixedKeystoreFile="$PWD/keystore.jks" \
            -PfixedKeystorePassword="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PfixedKeyAlias="${{ secrets.KEY_ALIAS }}" \
            -PfixedKeyPassword="${{ secrets.KEY_PASSWORD }}" \
            -PrequireFixedSigning=true
      - name: APK size and contents
        run: |
          # (v1.0.25 F) ABI splits: five outputs (4 per-ABI +
          # universal). Inspect EVERY one -- the old single-APK
          # `head -1` form would silently ignore the other four.
          for APK in app/build/outputs/apk/release/*.apk; do
            echo "APK: $APK"
            ls -l "$APK"
            unzip -l "$APK"
            AAPT2=$(find "${ANDROID_HOME:-$HOME/Android}" -name aapt2 -type f 2>/dev/null | head -1)
            if [ -n "$AAPT2" ]; then "$AAPT2" dump badging "$APK" | grep -E "package:|launchable-activity" || true; else echo "aapt2 not found under ANDROID_HOME"; fi
          done
      - name: Catalogue URLs return 200
        # (v0.2.2) The native CATALOGUE_REPOS map went stale in v0.2.1
        # (404 / malformed URLs) with nothing catching it. Every URL in
        # the map must answer HEAD 200, except turkish (known manifest
        # 404, kept deliberately as manifestDead in the catalogue)
        # and eclipsia (its dpdns.org host answers 403 to CI networks;
        # listed on the CloudStream wiki as maintained, kept with its
        # wiki plugin list — install may still work from a phone).
        run: |
          python3 - <<'EOF'
          import re, sys, urllib.request
          src = open('app/src/main/java/app/netlify/zaynplay/engine/ZaynEngine.kt').read()
          m = re.search(r'CATALOGUE_REPOS.*?listOf\((.*?)\)', src, re.S)
          urls = re.findall(r'"(https?://[^"]+)"', m.group(1))
          print(f"{len(urls)} catalogue URLs")
          if not urls:
              # (v0.2.11) Target 15: the baked catalogue is removed — no
              # repos by default, so there is nothing to check here.
              print("catalogue empty by design (target 15); skipping URL check")
              sys.exit(0)
          bad = []
          for u in urls:
              try:
                  req = urllib.request.Request(u, method='HEAD', headers={'User-Agent': 'Mozilla/5.0'})
                  code = urllib.request.urlopen(req, timeout=20).status
              except Exception as e:
                  code = getattr(e, 'code', None)
              print(u, '->', code)
              if code != 200 and 'cs-kraptor' not in u and 'eclipsia' not in u:
                  bad.append((u, code))
          if bad:
              print('BAD URLS:', bad); sys.exit(1)
          EOF
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zayn-play-1.0.25
          # (v1.0.25 F) ABI splits: five outputs (4 per-ABI +
          # universal). The old single-file path
          # app-release.apk no longer exists once splits are on
          # (the universal build is app-universal-release.apk).
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
